name: commercevision

x-object-storage-runtime-environment: &object-storage-runtime-environment
  CV_OBJECT_STORE_BACKEND: ${CV_OBJECT_STORE_BACKEND:-minio}
  CV_OBJECT_STORE_CREDENTIAL_MODE: ${CV_OBJECT_STORE_CREDENTIAL_MODE:-static}
  CV_OBJECT_STORE_ENDPOINT: ${CV_OBJECT_STORE_ENDPOINT:-http://minio:9000}
  CV_OBJECT_STORE_PRESIGN_ENDPOINT: ${CV_OBJECT_STORE_PRESIGN_ENDPOINT:-http://localhost:${CV_MINIO_API_HOST_PORT:-19000}}
  CV_OBJECT_STORE_ACCESS_KEY: ${CV_OBJECT_STORE_ACCESS_KEY:-commercevision}
  CV_OBJECT_STORE_SECRET_KEY: ${CV_OBJECT_STORE_SECRET_KEY:-commercevision-secret}
  CV_OBJECT_STORE_SESSION_TOKEN: ${CV_OBJECT_STORE_SESSION_TOKEN:-}
  CV_OBJECT_STORE_RAM_ROLE_NAME: ${CV_OBJECT_STORE_RAM_ROLE_NAME:-}
  CV_OBJECT_STORE_OIDC_ROLE_ARN: ${CV_OBJECT_STORE_OIDC_ROLE_ARN:-}
  CV_OBJECT_STORE_OIDC_PROVIDER_ARN: ${CV_OBJECT_STORE_OIDC_PROVIDER_ARN:-}
  CV_OBJECT_STORE_OIDC_TOKEN_FILE_PATH: ${CV_OBJECT_STORE_OIDC_TOKEN_FILE_PATH:-}
  CV_OBJECT_STORE_STS_ENDPOINT: ${CV_OBJECT_STORE_STS_ENDPOINT:-}
  CV_OBJECT_STORE_ROLE_SESSION_NAME: ${CV_OBJECT_STORE_ROLE_SESSION_NAME:-commercevision-object-storage}
  CV_OBJECT_STORE_REGION: ${CV_OBJECT_STORE_REGION:-us-east-1}
  CV_OBJECT_STORE_FORCE_PATH_STYLE: ${CV_OBJECT_STORE_FORCE_PATH_STYLE:-true}
  CV_OBJECT_STORE_TLS_VERIFY: ${CV_OBJECT_STORE_TLS_VERIFY:-true}
  CV_OBJECT_STORE_REQUIRE_ENCRYPTION: ${CV_OBJECT_STORE_REQUIRE_ENCRYPTION:-false}
  CV_OBJECT_STORE_CONNECT_TIMEOUT_SECONDS: ${CV_OBJECT_STORE_CONNECT_TIMEOUT_SECONDS:-3}
  CV_OBJECT_STORE_READ_TIMEOUT_SECONDS: ${CV_OBJECT_STORE_READ_TIMEOUT_SECONDS:-30}
  CV_OBJECT_STORE_READINESS_TIMEOUT_SECONDS: ${CV_OBJECT_STORE_READINESS_TIMEOUT_SECONDS:-1}
  CV_OBJECT_STORE_CREDENTIAL_REFRESH_TIMEOUT_SECONDS: ${CV_OBJECT_STORE_CREDENTIAL_REFRESH_TIMEOUT_SECONDS:-5}
  CV_OBJECT_STORE_QUARANTINE_BUCKET: ${CV_OBJECT_STORE_QUARANTINE_BUCKET:-quarantine-assets}
  CV_OBJECT_STORE_TASK_BUCKET: ${CV_OBJECT_STORE_TASK_BUCKET:-${CV_OBJECT_STORE_BUCKET:-task-assets}}
  CV_OBJECT_STORE_FOUNDATION_BUCKET: ${CV_OBJECT_STORE_FOUNDATION_BUCKET:-foundation-assets}
  CV_OBJECT_STORE_PROVIDER_RESULT_BUCKET: ${CV_OBJECT_STORE_PROVIDER_RESULT_BUCKET:-provider-results}

x-upload-cleanup-runtime-environment: &upload-cleanup-runtime-environment
  CV_UPLOAD_CLEANUP_PRESIGN_GRACE_SECONDS: ${CV_UPLOAD_CLEANUP_PRESIGN_GRACE_SECONDS:-30}
  CV_UPLOAD_CLEANUP_MAX_ATTEMPTS: ${CV_UPLOAD_CLEANUP_MAX_ATTEMPTS:-600}
  CV_UPLOAD_CLEANUP_RECONCILE_INTERVAL_SECONDS: ${CV_UPLOAD_CLEANUP_RECONCILE_INTERVAL_SECONDS:-3600}
  CV_UPLOAD_CLEANUP_RECONCILE_HORIZON_SECONDS: ${CV_UPLOAD_CLEANUP_RECONCILE_HORIZON_SECONDS:-259200}
  CV_UPLOAD_CLEANUP_RECONCILE_MAX_ATTEMPTS: ${CV_UPLOAD_CLEANUP_RECONCILE_MAX_ATTEMPTS:-80}
  CV_OPERATION_RETRY_MAX_ELAPSED_SECONDS: ${CV_OPERATION_RETRY_MAX_ELAPSED_SECONDS:-86400}
  CV_OPERATION_RECONCILIATION_MAX_SECONDS: ${CV_OPERATION_RECONCILIATION_MAX_SECONDS:-3600}
  CV_OPERATION_RECONCILIATION_MAX_ELAPSED_SECONDS: ${CV_OPERATION_RECONCILIATION_MAX_ELAPSED_SECONDS:-345600}

x-product-brief-policy-environment: &product-brief-policy-environment
  CV_VISION_ADAPTER: ${CV_VISION_ADAPTER:-deterministic}
  CV_DETERMINISTIC_VISION_SCENARIO: ${CV_DETERMINISTIC_VISION_SCENARIO:-success}
  CV_VISION_PROMPT_VERSION: ${CV_VISION_PROMPT_VERSION:-product-brief-prompt-v1}
  CV_VISION_PRODUCT_FACTS_MAXIMUM_BYTES: ${CV_VISION_PRODUCT_FACTS_MAXIMUM_BYTES:-65536}
  CV_VISION_PRODUCT_FACTS_MAXIMUM_DEPTH: ${CV_VISION_PRODUCT_FACTS_MAXIMUM_DEPTH:-8}
  CV_VISION_PRODUCT_FACTS_MAXIMUM_NODES: ${CV_VISION_PRODUCT_FACTS_MAXIMUM_NODES:-1024}
  CV_VISION_PRODUCT_FACTS_MAXIMUM_STRING_BYTES: ${CV_VISION_PRODUCT_FACTS_MAXIMUM_STRING_BYTES:-4096}
  CV_PRODUCT_BRIEF_REVIEW_POLICY_VERSION: ${CV_PRODUCT_BRIEF_REVIEW_POLICY_VERSION:-product-brief-review-v1}
  CV_PRODUCT_BRIEF_CONFIDENCE_THRESHOLD: "${CV_PRODUCT_BRIEF_CONFIDENCE_THRESHOLD:-0.80}"
  CV_PRODUCT_BRIEF_MANDATORY_REVIEW_PATHS: '${CV_PRODUCT_BRIEF_MANDATORY_REVIEW_PATHS:-[]}'
  CV_PRODUCT_BRIEF_SENSITIVE_CLAIM_PATHS: '${CV_PRODUCT_BRIEF_SENSITIVE_CLAIM_PATHS:-["common.sensitive_claims","beauty.ingredient_claim_evidence","beauty.skin_hair_claim_flags","beauty.medical_like_claim_flags","automotive.compatibility_evidence","automotive.safety_critical_claim_flags","automotive.certification_marks"]}'
  CV_PRODUCT_BRIEF_ANALYSIS_MAX_ATTEMPTS: ${CV_PRODUCT_BRIEF_ANALYSIS_MAX_ATTEMPTS:-5}
  CV_PRODUCT_BRIEF_ANALYSIS_MAX_RECONCILIATION_ATTEMPTS: ${CV_PRODUCT_BRIEF_ANALYSIS_MAX_RECONCILIATION_ATTEMPTS:-8}
  CV_VISION_TEMPORARY_REFERENCE_LIFETIME_SECONDS: ${CV_VISION_TEMPORARY_REFERENCE_LIFETIME_SECONDS:-60}
  CV_VISION_DATA_TRANSFER_ENABLED: ${CV_VISION_DATA_TRANSFER_ENABLED:-false}
  CV_VISION_DATA_TRANSFER_POLICY_VERSION: ${CV_VISION_DATA_TRANSFER_POLICY_VERSION:-vision-transfer-deny-v1}
  CV_VISION_DATA_TRANSFER_ALLOWED_WORKSPACE_IDS: '${CV_VISION_DATA_TRANSFER_ALLOWED_WORKSPACE_IDS:-[]}'
  CV_VISION_DATA_TRANSFER_ALLOWED_RETENTION_CLASSES: '${CV_VISION_DATA_TRANSFER_ALLOWED_RETENTION_CLASSES:-[]}'
  CV_VISION_DATA_TRANSFER_ALLOWED_PROVIDERS: '${CV_VISION_DATA_TRANSFER_ALLOWED_PROVIDERS:-[]}'
  CV_VISION_DATA_TRANSFER_ALLOWED_ENDPOINT_REGIONS: '${CV_VISION_DATA_TRANSFER_ALLOWED_ENDPOINT_REGIONS:-[]}'
  CV_VISION_DATA_TRANSFER_ALLOWED_ENDPOINT_HOSTS: '${CV_VISION_DATA_TRANSFER_ALLOWED_ENDPOINT_HOSTS:-[]}'
  CV_ALIBABA_VISION_ENDPOINT: ${CV_ALIBABA_VISION_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  CV_ALIBABA_VISION_ENDPOINT_REGION: ${CV_ALIBABA_VISION_ENDPOINT_REGION:-cn-beijing}
  CV_ALIBABA_VISION_MODEL: ${CV_ALIBABA_VISION_MODEL:-qwen-vl-max}
  CV_ALIBABA_VISION_MODEL_SNAPSHOT: ${CV_ALIBABA_VISION_MODEL_SNAPSHOT:-qwen-vl-max}
  CV_ALIBABA_VISION_ADAPTER_VERSION: ${CV_ALIBABA_VISION_ADAPTER_VERSION:-alibaba-openai-vision-v1}
  CV_ALIBABA_VISION_CONNECT_TIMEOUT_SECONDS: ${CV_ALIBABA_VISION_CONNECT_TIMEOUT_SECONDS:-3}
  CV_ALIBABA_VISION_READ_TIMEOUT_SECONDS: ${CV_ALIBABA_VISION_READ_TIMEOUT_SECONDS:-30}
  CV_ALIBABA_VISION_END_TO_END_TIMEOUT_SECONDS: ${CV_ALIBABA_VISION_END_TO_END_TIMEOUT_SECONDS:-45}
  CV_ALIBABA_VISION_MAXIMUM_CONCURRENCY: ${CV_ALIBABA_VISION_MAXIMUM_CONCURRENCY:-4}
  CV_ALIBABA_VISION_MAXIMUM_RESPONSE_BYTES: ${CV_ALIBABA_VISION_MAXIMUM_RESPONSE_BYTES:-524288}
  CV_ALIBABA_VISION_MAXIMUM_OUTPUT_TOKENS: ${CV_ALIBABA_VISION_MAXIMUM_OUTPUT_TOKENS:-4096}
  CV_ALIBABA_VISION_MAXIMUM_REPAIR_ATTEMPTS: ${CV_ALIBABA_VISION_MAXIMUM_REPAIR_ATTEMPTS:-1}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: commercevision
      MYSQL_USER: commercevision
      MYSQL_PASSWORD: ${CV_MYSQL_PASSWORD:-commercevision}
      MYSQL_ROOT_PASSWORD: ${CV_MYSQL_ROOT_PASSWORD:-root-change-me}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_MYSQL_HOST_PORT:-13316}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysql --protocol=TCP --host=127.0.0.1 --user=root --database=$${MYSQL_DATABASE} --batch --skip-column-names --execute='SELECT 1' | grep --quiet --line-regexp 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  mysql-permissions:
    image: mysql:8.4
    command:
      - /bin/sh
      - /opt/commercevision/reconcile-runtime-grants.sh
    environment:
      MYSQL_ROOT_PASSWORD: ${CV_MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_RUNTIME_PASSWORD: ${CV_MYSQL_PASSWORD:-commercevision}
    volumes:
      - ../mysql/reconcile-runtime-grants.sql:/opt/commercevision/reconcile-runtime-grants.sql:ro
      - ../mysql/reconcile-runtime-grants.sh:/opt/commercevision/reconcile-runtime-grants.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks: [commercevision]

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      args:
        UV_INDEX_URL: ${CV_PYPI_INDEX_URL:-https://pypi.org/simple}
    command: ["alembic", "upgrade", "head"]
    environment:
      CV_SERVICE_NAME: migration
      CV_ENVIRONMENT: local
      CV_MIGRATION_MYSQL_DSN: ${CV_MIGRATION_MYSQL_DSN:-mysql+pymysql://root:${CV_MYSQL_ROOT_PASSWORD:-root-change-me}@mysql:3306/commercevision}
    depends_on:
      mysql:
        condition: service_healthy
      mysql-permissions:
        condition: service_completed_successfully
    restart: "no"
    networks: [commercevision]

  redis:
    image: valkey/valkey:8.1.8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [commercevision]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: commercevision
      RABBITMQ_DEFAULT_PASS: ${CV_RABBITMQ_PASSWORD:-commercevision}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_RABBITMQ_HOST_PORT:-15673}:5672"
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_RABBITMQ_MANAGEMENT_PORT:-25672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CV_OBJECT_STORE_ACCESS_KEY:-commercevision}
      MINIO_ROOT_PASSWORD: ${CV_OBJECT_STORE_SECRET_KEY:-commercevision-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CV_OBJECT_STORE_CORS_ORIGINS:-http://localhost:13000}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_MINIO_API_HOST_PORT:-19000}:9000"
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  clamav:
    image: clamav/clamav:1.5.3_base@sha256:b2be682d7514281f20117fb8fe15a7f8da9e4f6ea0b4b819f6c74c84ce84d1d7
    restart: unless-stopped
    environment:
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_StreamMaxLength: 100M
      FRESHCLAM_CHECKS: "24"
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [commercevision]

  object-storage-init:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      args:
        UV_INDEX_URL: ${CV_PYPI_INDEX_URL:-https://pypi.org/simple}
    command: ["commercevision-provision-minio"]
    environment:
      CV_SERVICE_NAME: object-storage-init
      CV_ENVIRONMENT: local
      CV_OBJECT_STORE_BACKEND: minio
      CV_OBJECT_STORE_ENDPOINT: http://minio:9000
      CV_OBJECT_STORE_ACCESS_KEY: ${CV_OBJECT_STORE_ACCESS_KEY:-commercevision}
      CV_OBJECT_STORE_SECRET_KEY: ${CV_OBJECT_STORE_SECRET_KEY:-commercevision-secret}
      CV_OBJECT_STORE_REGION: ${CV_OBJECT_STORE_REGION:-us-east-1}
      CV_OBJECT_STORE_FORCE_PATH_STYLE: ${CV_OBJECT_STORE_FORCE_PATH_STYLE:-true}
      CV_OBJECT_STORE_TLS_VERIFY: ${CV_OBJECT_STORE_TLS_VERIFY:-true}
      CV_OBJECT_STORE_QUARANTINE_BUCKET: ${CV_OBJECT_STORE_QUARANTINE_BUCKET:-quarantine-assets}
      CV_OBJECT_STORE_TASK_BUCKET: ${CV_OBJECT_STORE_TASK_BUCKET:-${CV_OBJECT_STORE_BUCKET:-task-assets}}
      CV_OBJECT_STORE_FOUNDATION_BUCKET: ${CV_OBJECT_STORE_FOUNDATION_BUCKET:-foundation-assets}
      CV_OBJECT_STORE_PROVIDER_RESULT_BUCKET: ${CV_OBJECT_STORE_PROVIDER_RESULT_BUCKET:-provider-results}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [commercevision]

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  milvus:
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${CV_OBJECT_STORE_ACCESS_KEY:-commercevision}
      MINIO_SECRET_ACCESS_KEY: ${CV_OBJECT_STORE_SECRET_KEY:-commercevision-secret}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_MILVUS_HOST_PORT:-19531}:19530"
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_MILVUS_HEALTH_HOST_PORT:-19091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [commercevision]

  otel-collector:
    build:
      context: ../..
      dockerfile: infra/docker/otel.Dockerfile
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_OTEL_GRPC_HOST_PORT:-14317}:4317"
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_OTEL_HTTP_HOST_PORT:-14318}:4318"
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_OTEL_HEALTH_HOST_PORT:-14319}:13133"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      args:
        UV_INDEX_URL: ${CV_PYPI_INDEX_URL:-https://pypi.org/simple}
    command:
      - uvicorn
      - commercevision_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: [*object-storage-runtime-environment, *upload-cleanup-runtime-environment, *product-brief-policy-environment]
      CV_SERVICE_NAME: control-api
      CV_ENVIRONMENT: local
      CV_READINESS_PROBE_EXTERNAL: "true"
      CV_MYSQL_DSN: mysql+aiomysql://commercevision:${CV_MYSQL_PASSWORD:-commercevision}@mysql:3306/commercevision
      CV_MYSQL_CONNECT_TIMEOUT_SECONDS: ${CV_MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      CV_REDIS_URL: redis://redis:6379/0
      CV_RABBITMQ_URL: amqp://commercevision:${CV_RABBITMQ_PASSWORD:-commercevision}@rabbitmq:5672//
      CV_UPLOAD_SESSION_EXPIRY_SECONDS: ${CV_UPLOAD_SESSION_EXPIRY_SECONDS:-900}
      CV_UPLOAD_FINALIZE_LEASE_SECONDS: ${CV_UPLOAD_FINALIZE_LEASE_SECONDS:-120}
      CV_UPLOAD_MAX_BYTES: ${CV_UPLOAD_MAX_BYTES:-10485760}
      CV_UPLOAD_MAX_LORA_BYTES: ${CV_UPLOAD_MAX_LORA_BYTES:-104857600}
      CV_UPLOAD_MAX_PROMPT_TEMPLATE_BYTES: ${CV_UPLOAD_MAX_PROMPT_TEMPLATE_BYTES:-262144}
      CV_UPLOAD_MAX_MODEL_CONFIGURATION_BYTES: ${CV_UPLOAD_MAX_MODEL_CONFIGURATION_BYTES:-65536}
      CV_UPLOAD_MAX_IMAGE_DIMENSION: ${CV_UPLOAD_MAX_IMAGE_DIMENSION:-1280}
      CV_UPLOAD_MAX_IMAGE_PIXELS: ${CV_UPLOAD_MAX_IMAGE_PIXELS:-1638400}
      CV_UPLOAD_MAX_IMAGE_FRAMES: ${CV_UPLOAD_MAX_IMAGE_FRAMES:-1}
      CV_UPLOAD_MAX_METADATA_BYTES: ${CV_UPLOAD_MAX_METADATA_BYTES:-262144}
      CV_UPLOAD_POLICY_VERSION: ${CV_UPLOAD_POLICY_VERSION:-direct-put-v1}
      CV_UPLOAD_INTEGRITY_POLICY_VERSION: ${CV_UPLOAD_INTEGRITY_POLICY_VERSION:-image-integrity-v1}
      CV_ASSET_VALIDATION_POLICY_VERSION: ${CV_ASSET_VALIDATION_POLICY_VERSION:-asset-validation-v1}
      CV_ASSET_VALIDATION_MAX_ATTEMPTS: ${CV_ASSET_VALIDATION_MAX_ATTEMPTS:-5}
      CV_TRUSTED_PRINCIPAL_CURRENT_KEY_ID: ${CV_TRUSTED_PRINCIPAL_CURRENT_KEY_ID:-local-web-gateway}
      CV_TRUSTED_PRINCIPAL_CURRENT_HMAC_SECRET: ${CV_TRUSTED_PRINCIPAL_CURRENT_HMAC_SECRET:-local-web-gateway-secret-change-before-production}
      CV_TRUSTED_PRINCIPAL_PREVIOUS_KEY_ID: ${CV_TRUSTED_PRINCIPAL_PREVIOUS_KEY_ID:-}
      CV_TRUSTED_PRINCIPAL_PREVIOUS_HMAC_SECRET: ${CV_TRUSTED_PRINCIPAL_PREVIOUS_HMAC_SECRET:-}
      CV_TRUSTED_PRINCIPAL_MAX_AGE_SECONDS: ${CV_TRUSTED_PRINCIPAL_MAX_AGE_SECONDS:-300}
      CV_TRUSTED_PRINCIPAL_FUTURE_SKEW_SECONDS: ${CV_TRUSTED_PRINCIPAL_FUTURE_SKEW_SECONDS:-30}
      CV_BRAND_PROFILE_CURSOR_MAX_AGE_SECONDS: ${CV_BRAND_PROFILE_CURSOR_MAX_AGE_SECONDS:-86400}
      CV_BRAND_PROFILE_CURSOR_FUTURE_SKEW_SECONDS: ${CV_BRAND_PROFILE_CURSOR_FUTURE_SKEW_SECONDS:-30}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_API_HOST_PORT:-18000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      args:
        UV_INDEX_URL: ${CV_PYPI_INDEX_URL:-https://pypi.org/simple}
    command:
      - celery
      - -A
      - commercevision_worker.celery_app:celery_app
      - worker
      - --pool=prefork
      - --loglevel=INFO
      - --concurrency=${CV_WORKER_CONCURRENCY:-2}
    environment:
      <<: [*object-storage-runtime-environment, *upload-cleanup-runtime-environment, *product-brief-policy-environment]
      CV_SERVICE_NAME: agent-worker
      CV_ENVIRONMENT: local
      CV_MYSQL_DSN: mysql+pymysql://commercevision:${CV_MYSQL_PASSWORD:-commercevision}@mysql:3306/commercevision
      CV_MYSQL_CONNECT_TIMEOUT_SECONDS: ${CV_MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      CV_RABBITMQ_URL: amqp://commercevision:${CV_RABBITMQ_PASSWORD:-commercevision}@rabbitmq:5672//
      CV_WORKER_CONCURRENCY: "${CV_WORKER_CONCURRENCY:-2}"
      CV_WORKER_READINESS_PATH: /tmp/commercevision-worker-ready.json
      CV_WORKER_READINESS_MAX_AGE_SECONDS: ${CV_WORKER_READINESS_MAX_AGE_SECONDS:-50}
      CV_WORKER_STOP_GRACE_PERIOD_SECONDS: ${CV_WORKER_STOP_GRACE_PERIOD_SECONDS:-90}
      CV_WORKER_QUEUES: '["commercevision.workflow", "commercevision.asset", "commercevision.index", "commercevision.maintenance"]'
      CV_WORKER_REQUIRED_OPERATION_KINDS: '["ASSET_VALIDATION", "ASSET_DELETION", "ASSET_INDEXING", "PRODUCT_BRIEF_ANALYSIS"]'
      CV_MILVUS_URI: http://milvus:19530
      CV_MILVUS_TOKEN: ${CV_MILVUS_TOKEN:-}
      CV_MILVUS_DATABASE: default
      CV_MILVUS_TIMEOUT_SECONDS: ${CV_MILVUS_TIMEOUT_SECONDS:-10}
      CV_MILVUS_READINESS_TIMEOUT_SECONDS: ${CV_MILVUS_READINESS_TIMEOUT_SECONDS:-1}
      CV_EMBEDDING_ADAPTER: ${CV_EMBEDDING_ADAPTER:-deterministic}
      CV_EMBEDDING_PROVIDER: ${CV_EMBEDDING_PROVIDER:-fixture}
      CV_DETERMINISTIC_EMBEDDING_SCENARIO: ${CV_DETERMINISTIC_EMBEDDING_SCENARIO:-SUCCESS}
      CV_EMBEDDING_MODEL_FAMILY: ${CV_EMBEDDING_MODEL_FAMILY:-deterministic-image-embedding}
      CV_EMBEDDING_MODEL_ID: ${CV_EMBEDDING_MODEL_ID:-deterministic-image-embedding-v1}
      CV_EMBEDDING_PINNED_REVISION: ${CV_EMBEDDING_PINNED_REVISION:-fixture-epoch-v1}
      CV_EMBEDDING_DIMENSION: ${CV_EMBEDDING_DIMENSION:-256}
      CV_EMBEDDING_MODEL_CONFIGURATION_VERSION: ${CV_EMBEDDING_MODEL_CONFIGURATION_VERSION:-image-embedding-config-v1}
      CV_EMBEDDING_PREPROCESSING_VERSION: ${CV_EMBEDDING_PREPROCESSING_VERSION:-image-preprocess-v1}
      CV_IMAGE_INDEX_TEMPORARY_REFERENCE_LIFETIME_SECONDS: ${CV_IMAGE_INDEX_TEMPORARY_REFERENCE_LIFETIME_SECONDS:-60}
      CV_IMAGE_INDEX_MAX_ATTEMPTS: ${CV_IMAGE_INDEX_MAX_ATTEMPTS:-5}
      CV_IMAGE_INDEX_MAX_RECONCILIATION_ATTEMPTS: ${CV_IMAGE_INDEX_MAX_RECONCILIATION_ATTEMPTS:-8}
      CV_EMBEDDING_DATA_TRANSFER_ENABLED: ${CV_EMBEDDING_DATA_TRANSFER_ENABLED:-false}
      CV_EMBEDDING_DATA_TRANSFER_POLICY_VERSION: ${CV_EMBEDDING_DATA_TRANSFER_POLICY_VERSION:-embedding-transfer-deny-v1}
      CV_EMBEDDING_DATA_TRANSFER_ALLOWED_WORKSPACE_IDS: '${CV_EMBEDDING_DATA_TRANSFER_ALLOWED_WORKSPACE_IDS:-[]}'
      CV_EMBEDDING_DATA_TRANSFER_ALLOWED_RETENTION_CLASSES: '${CV_EMBEDDING_DATA_TRANSFER_ALLOWED_RETENTION_CLASSES:-[]}'
      CV_EMBEDDING_DATA_TRANSFER_ALLOWED_PROVIDERS: '${CV_EMBEDDING_DATA_TRANSFER_ALLOWED_PROVIDERS:-[]}'
      CV_EMBEDDING_DATA_TRANSFER_ALLOWED_ENDPOINT_REGIONS: '${CV_EMBEDDING_DATA_TRANSFER_ALLOWED_ENDPOINT_REGIONS:-[]}'
      CV_EMBEDDING_DATA_TRANSFER_ALLOWED_ENDPOINT_HOSTS: '${CV_EMBEDDING_DATA_TRANSFER_ALLOWED_ENDPOINT_HOSTS:-[]}'
      CV_ALIBABA_EMBEDDING_API_KEY_FILE: /run/secrets/alibaba-embedding-api-key
      CV_ALIBABA_EMBEDDING_ALLOWED_IMAGE_ORIGINS: '${CV_ALIBABA_EMBEDDING_ALLOWED_IMAGE_ORIGINS:-[]}'
      CV_UPLOAD_MAX_BYTES: ${CV_UPLOAD_MAX_BYTES:-10485760}
      CV_UPLOAD_MAX_LORA_BYTES: ${CV_UPLOAD_MAX_LORA_BYTES:-104857600}
      CV_UPLOAD_MAX_PROMPT_TEMPLATE_BYTES: ${CV_UPLOAD_MAX_PROMPT_TEMPLATE_BYTES:-262144}
      CV_UPLOAD_MAX_MODEL_CONFIGURATION_BYTES: ${CV_UPLOAD_MAX_MODEL_CONFIGURATION_BYTES:-65536}
      CV_ASSET_VALIDATION_POLICY_VERSION: ${CV_ASSET_VALIDATION_POLICY_VERSION:-asset-validation-v1}
      CV_ASSET_VALIDATION_JSON_MAXIMUM_DEPTH: ${CV_ASSET_VALIDATION_JSON_MAXIMUM_DEPTH:-32}
      CV_ASSET_VALIDATION_JSON_MAXIMUM_NODES: ${CV_ASSET_VALIDATION_JSON_MAXIMUM_NODES:-10000}
      CV_ASSET_MALWARE_ADAPTER: clamav
      CV_CLAMAV_HOST: clamav
      CV_CLAMAV_PORT: "3310"
      CV_CLAMAV_TIMEOUT_SECONDS: ${CV_CLAMAV_TIMEOUT_SECONDS:-15}
      CV_CLAMAV_MAXIMUM_CONCURRENCY: ${CV_CLAMAV_MAXIMUM_CONCURRENCY:-4}
      CV_CLAMAV_STREAM_MAX_BYTES: ${CV_CLAMAV_STREAM_MAX_BYTES:-104857600}
      CV_CLAMAV_CHUNK_BYTES: ${CV_CLAMAV_CHUNK_BYTES:-65536}
      CV_CLAMAV_MAXIMUM_RESPONSE_BYTES: ${CV_CLAMAV_MAXIMUM_RESPONSE_BYTES:-4096}
      CV_ASSET_CONTENT_SAFETY_ADAPTER: deterministic
      CV_DETERMINISTIC_CONTENT_SAFETY_OUTCOME: ${CV_DETERMINISTIC_CONTENT_SAFETY_OUTCOME:-PASS}
      CV_CONTENT_SAFETY_POLICY_VERSION: ${CV_CONTENT_SAFETY_POLICY_VERSION:-content-safety-policy-v1}
      CV_CONTENT_SAFETY_MAPPING_VERSION: ${CV_CONTENT_SAFETY_MAPPING_VERSION:-content-safety-map-v1}
      CV_ALIBABA_VISION_API_KEY_FILE: /run/secrets/alibaba-vision-api-key
      CV_ALIBABA_VISION_API_KEY_FILE_MAX_BYTES: ${CV_ALIBABA_VISION_API_KEY_FILE_MAX_BYTES:-4096}
      CV_ALIBABA_VISION_ALLOWED_IMAGE_ORIGINS: '${CV_ALIBABA_VISION_ALLOWED_IMAGE_ORIGINS:-[]}'
      CV_VISION_PREFLIGHT_BUDGET_SECONDS: ${CV_VISION_PREFLIGHT_BUDGET_SECONDS:-10}
      CV_VISION_OPERATION_LEASE_MARGIN_SECONDS: ${CV_VISION_OPERATION_LEASE_MARGIN_SECONDS:-15}
      CV_PROVIDER_ARTIFACT_RECONCILIATION_TARGETS: '${CV_PROVIDER_ARTIFACT_RECONCILIATION_TARGETS:-[]}'
      CV_ASSET_PROVENANCE_ADAPTER: deterministic
      CV_DETERMINISTIC_PROVENANCE_STATUS: ${CV_DETERMINISTIC_PROVENANCE_STATUS:-NOT_PRESENT}
      CV_C2PA_TRUST_CONFIG_VERSION: ${CV_C2PA_TRUST_CONFIG_VERSION:-c2pa-trust-v1}
    volumes:
      - type: bind
        source: "${CV_ALIBABA_VISION_API_KEY_HOST_PATH:-./fixtures/blank-alibaba-vision-api-key}"
        target: /run/secrets/alibaba-vision-api-key
        read_only: true
      - type: bind
        source: "${CV_ALIBABA_EMBEDDING_API_KEY_HOST_PATH:-./fixtures/blank-alibaba-vision-api-key}"
        target: /run/secrets/alibaba-embedding-api-key
        read_only: true
    depends_on:
      clamav:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
    stop_grace_period: "${CV_WORKER_STOP_GRACE_PERIOD_SECONDS:-90}s"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "commercevision_worker.readiness",
          "healthcheck",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [commercevision]

  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      args:
        UV_INDEX_URL: ${CV_PYPI_INDEX_URL:-https://pypi.org/simple}
    command:
      - commercevision-scheduler
    environment:
      <<: *upload-cleanup-runtime-environment
      CV_SERVICE_NAME: scheduler
      CV_ENVIRONMENT: local
      CV_MYSQL_DSN: mysql+pymysql://commercevision:${CV_MYSQL_PASSWORD:-commercevision}@mysql:3306/commercevision
      CV_MYSQL_CONNECT_TIMEOUT_SECONDS: ${CV_MYSQL_CONNECT_TIMEOUT_SECONDS:-5}
      CV_RABBITMQ_URL: amqp://commercevision:${CV_RABBITMQ_PASSWORD:-commercevision}@rabbitmq:5672//
      CV_SCHEDULER_HOST: 0.0.0.0
      CV_SCHEDULER_PORT: "8002"
      CV_RIGHTS_EXPIRY_SCAN_INTERVAL_SECONDS: ${CV_RIGHTS_EXPIRY_SCAN_INTERVAL_SECONDS:-10}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_SCHEDULER_HOST_PORT:-18002}:8002"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  mcp-server:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      args:
        UV_INDEX_URL: ${CV_PYPI_INDEX_URL:-https://pypi.org/simple}
    command:
      - commercevision-mcp
    environment:
      CV_SERVICE_NAME: mcp-server
      CV_ENVIRONMENT: local
      CV_MCP_TRANSPORT: streamable-http
      CV_MCP_HOST: 0.0.0.0
      CV_MCP_PORT: "8001"
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_MCP_HOST_PORT:-18001}:8001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commercevision]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      CV_API_PROXY_URL: http://api:8000
      CV_API_PROXY_TIMEOUT_MS: ${CV_API_PROXY_TIMEOUT_MS:-15000}
      CV_TRUSTED_PRINCIPAL_CURRENT_KEY_ID: ${CV_TRUSTED_PRINCIPAL_CURRENT_KEY_ID:-local-web-gateway}
      CV_TRUSTED_PRINCIPAL_CURRENT_HMAC_SECRET: ${CV_TRUSTED_PRINCIPAL_CURRENT_HMAC_SECRET:-local-web-gateway-secret-change-before-production}
      CV_WEB_ALLOWED_WORKSPACE_IDS: ${CV_WEB_ALLOWED_WORKSPACE_IDS:-catalog-demo}
      CV_WEB_ADMIN_WORKSPACE_IDS: ${CV_WEB_ADMIN_WORKSPACE_IDS:-}
      CV_WEB_PRINCIPAL_ACTOR_ID: ${CV_WEB_PRINCIPAL_ACTOR_ID:-catalog-workbench}
    ports:
      - "${CV_BIND_HOST:-127.0.0.1}:${CV_WEB_HOST_PORT:-13000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commercevision]

volumes:
  cache_data:
  clamav_data:
  etcd_data:
  milvus_data:
  minio_data:
  mysql_data:
  rabbitmq_data:

networks:
  commercevision:
    driver: bridge
