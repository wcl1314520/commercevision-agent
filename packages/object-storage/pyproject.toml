[project]
name = "commercevision-object-storage"
version = "0.3.0"
description = "MinIO and Alibaba OSS object-storage adapters"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alibabacloud-credentials>=1.0.2,<2",
  "boto3>=1.37,<2",
  "commercevision-contracts",
  "commercevision-domain",
  "oss2>=2.19,<3",
]

[project.scripts]
commercevision-provision-minio = "commercevision_object_storage.provision_minio:main"

[tool.uv.sources]
commercevision-contracts = { workspace = true }
commercevision-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commercevision_object_storage"]
