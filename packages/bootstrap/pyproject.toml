[project]
name = "commercevision-bootstrap"
version = "0.1.0"
description = "Shared CommerceVision service composition helpers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "commercevision-application",
  "commercevision-contracts",
  "commercevision-domain",
  "commercevision-object-storage",
  "commercevision-observability",
  "commercevision-persistence",
  "commercevision-providers",
  "commercevision-retrieval",
]

[tool.uv.sources]
commercevision-application = { workspace = true }
commercevision-contracts = { workspace = true }
commercevision-domain = { workspace = true }
commercevision-object-storage = { workspace = true }
commercevision-observability = { workspace = true }
commercevision-persistence = { workspace = true }
commercevision-providers = { workspace = true }
commercevision-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commercevision_bootstrap"]
