[project]
name = "commercevision-providers"
version = "0.3.0"
description = "External model provider adapters"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alibabacloud-green20220302==3.2.4",
  "c2pa-python==0.36.0",
  "commercevision-contracts",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
]

[tool.uv.sources]
commercevision-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commercevision_providers"]
