[project]
name = "commercevision-mcp-server"
version = "0.3.0"
description = "Controlled CommerceVision MCP tool server"
requires-python = ">=3.13,<3.14"
dependencies = [
  "commercevision-application",
  "commercevision-bootstrap",
  "commercevision-contracts",
  "commercevision-domain",
  "commercevision-object-storage",
  "commercevision-observability",
  "commercevision-persistence",
  "commercevision-tool-runtime",
  "mcp>=1.9,<2",
  "starlette>=0.49,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
commercevision-mcp = "commercevision_mcp.main:main"

[tool.uv.sources]
commercevision-application = { workspace = true }
commercevision-bootstrap = { workspace = true }
commercevision-contracts = { workspace = true }
commercevision-domain = { workspace = true }
commercevision-object-storage = { workspace = true }
commercevision-observability = { workspace = true }
commercevision-persistence = { workspace = true }
commercevision-tool-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commercevision_mcp"]
