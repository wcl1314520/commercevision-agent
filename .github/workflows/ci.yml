name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: commercevision
          MYSQL_USER: commercevision
          MYSQL_PASSWORD: commercevision
          MYSQL_ROOT_PASSWORD: root-change-me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=root-change-me mysql --protocol=TCP
          --host=127.0.0.1 --user=root --database=commercevision
          --batch --skip-column-names --execute='SELECT 1'
          | grep --quiet --line-regexp 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: commercevision
          RABBITMQ_DEFAULT_PASS: commercevision
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CV_ENVIRONMENT: ci
      CV_MYSQL_DSN: mysql+pymysql://commercevision:commercevision@127.0.0.1:3306/commercevision
      CV_TEST_MYSQL_DSN: mysql+pymysql://root:root-change-me@127.0.0.1:3306/commercevision_test
      CV_TEST_RABBITMQ_URL: amqp://commercevision:commercevision@127.0.0.1:5672//
      CV_MILVUS_URI: http://127.0.0.1:19531
      CV_MILVUS_READINESS_TIMEOUT_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - run: uv sync --locked --all-packages
      - name: Start MinIO integration service
        run: |
          docker network create commercevision-test
          docker run --detach --rm --name commercevision-test-minio \
            --network commercevision-test \
            --publish 19000:9000 \
            --env MINIO_ROOT_USER=commercevision \
            --env MINIO_ROOT_PASSWORD=commercevision-secret \
            minio/minio:RELEASE.2024-06-13T22-53-53Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:19000/minio/health/live
      - name: Start Milvus integration service
        run: |
          docker run --detach --rm --name commercevision-test-etcd \
            --network commercevision-test \
            quay.io/coreos/etcd:v3.5.15 \
            etcd --advertise-client-urls=http://commercevision-test-etcd:2379 \
            --listen-client-urls=http://0.0.0.0:2379
          docker run --detach --rm --name commercevision-test-milvus \
            --network commercevision-test \
            --publish 19531:19530 --publish 19091:9091 \
            --env ETCD_ENDPOINTS=commercevision-test-etcd:2379 \
            --env MINIO_ADDRESS=commercevision-test-minio:9000 \
            --env MINIO_ACCESS_KEY_ID=commercevision \
            --env MINIO_SECRET_ACCESS_KEY=commercevision-secret \
            milvusdb/milvus:v2.4.15 milvus run standalone
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:19091/healthz; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:19091/healthz
      - name: Reconcile runtime database grants
        run: >-
          docker exec --interactive
          --env MYSQL_PWD=root-change-me
          ${{ job.services.mysql.id }}
          mysql --protocol=TCP --host=127.0.0.1 --user=root
          < infra/mysql/reconcile-runtime-grants.sql
      - name: Upgrade schema
        run: uv run alembic upgrade head
        env:
          CV_MIGRATION_MYSQL_DSN: mysql+pymysql://root:root-change-me@127.0.0.1:3306/commercevision
      - name: Check schema drift
        run: uv run alembic check
        env:
          CV_MIGRATION_MYSQL_DSN: mysql+pymysql://root:root-change-me@127.0.0.1:3306/commercevision
      - name: Verify runtime database grants
        run: uv run pytest tests/integration/test_mysql_runtime_privileges.py -q
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Type-check release-critical Python without a baseline
        run: >-
          uv run mypy
          packages/evaluation
          scripts/audit_licenses.py
          scripts/check_mypy_baseline.py
      - name: Reject full-workspace Python type drift
        run: uv run python scripts/check_mypy_baseline.py
      - name: Enforce Python dependency license policy
        run: uv run python scripts/audit_licenses.py
      - name: Audit Phase 2 release acceptance evidence
        run: >-
          uv run commercevision-phase2-acceptance
          --manifest evaluation/phase2/release-v1/manifest.json
          --repository-root .
          --json-output .artifacts/acceptance/phase2-release.json
          --markdown-output .artifacts/acceptance/phase2-release.md
      - name: Retain Phase 2 release acceptance evidence
        if: ${{ always() && hashFiles('.artifacts/acceptance/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase2-release-acceptance
          path: .artifacts/acceptance/
          if-no-files-found: error
      - name: Verify daily retrieval ranking fixture
        run: uv run pytest tests/contract/test_retrieval_evaluation_release_gate.py -q
      - name: Run daily retrieval evaluation gate
        run: >-
          uv run commercevision-retrieval-eval
          --manifest evaluation/retrieval/daily-v1/manifest.json
          --observations evaluation/retrieval/daily-v1/observations.json
          --profile daily
          --json-output .artifacts/evaluation/retrieval-daily-v1.json
          --markdown-output .artifacts/evaluation/retrieval-daily-v1.md
      - name: Retain daily retrieval evaluation reports
        if: ${{ always() && hashFiles('.artifacts/evaluation/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation-daily
          path: .artifacts/evaluation/
          if-no-files-found: error
      - name: Verify Planner fixtures and evaluation contracts
        run: uv run pytest tests/contract/test_planner_evaluation_release_gate.py -q
      - name: Run Planner evaluation gate
        run: >-
          uv run commercevision-planner-eval
          --manifest evaluation/planner/ci-v1/manifest.json
          --fixtures evaluation/planner/ci-v1/fixtures.json
          --observations evaluation/planner/ci-v1/observations.json
          --profile ci
          --json-output .artifacts/planner-evaluation/planner-ci-v1.json
          --markdown-output .artifacts/planner-evaluation/planner-ci-v1.md
      - name: Retain Planner evaluation reports
        if: ${{ always() && hashFiles('.artifacts/planner-evaluation/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-evaluation-ci
          path: .artifacts/planner-evaluation/
          if-no-files-found: error
      - run: uv run pytest
      - run: uv run python scripts/audit_python.py
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/api/openapi.json

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:proxy-test
      - run: pnpm web:unit-test
      - name: Enforce Node production dependency license policy
        run: pnpm licenses list --prod --json | node scripts/audit-node-licenses.mjs
      - run: pnpm web:api-types:check
      - run: pnpm web:build
      - run: pnpm --filter @commercevision/web exec playwright install --with-deps chromium
      - run: pnpm web:e2e
      - run: pnpm audit --audit-level=moderate

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/docker-compose.yml config --quiet
      - name: Validate isolated public-demo Compose profile
        run: >-
          docker compose
          --env-file infra/public-demo/phase2.env.example
          -f infra/compose/docker-compose.yml
          config --quiet
      - run: >-
          docker compose -f infra/compose/docker-compose.yml build
          api worker scheduler mcp-server web otel-collector

  security:
    name: Security and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
